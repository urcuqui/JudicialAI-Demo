services:
  judicial-ai-demo:
    build: .
    image: judicial-ai-demo:latest
    ports:
      # El host mapea al puerto 5050 porque en macOS el 5000 suele estar
      # ocupado por AirPlay Receiver (ControlCenter). El contenedor sigue
      # escuchando internamente en el 5000.
      - "5050:5000"
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1:8b}"
    extra_hosts:
      # En Docker Desktop (macOS/Windows) host.docker.internal ya funciona
      # de forma nativa; esta línea lo habilita también en Linux.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
